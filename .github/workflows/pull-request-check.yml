name: Validate DND Blocks PR
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, unit tests, and production build
        run: npm run check
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Smoke test built site in Chromium
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/dnd-blocks-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.mjs
