name: Sync Browser Bundle

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-browser-bundle
  cancel-in-progress: true

jobs:
  sync-browser-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source and static build
        run: npm run check

      - name: Stamp browser module graph with this revision
        env:
          BUILD_REV: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          rev = os.environ["BUILD_REV"][:12]
          root = Path("web")

          # Every relative JS dependency gets the same revision query.
          # This forces the browser/CDN to request the whole current module graph.
          patterns = [
              (re.compile(r"(from\s+['\"])(\.{1,2}/[^'\"]+?\.js)(?:\?v=[^'\"]+)?(['\"])"), r"\1\2?v=" + rev + r"\3"),
              (re.compile(r"(import\(\s*['\"])(\.{1,2}/[^'\"]+?\.js)(?:\?v=[^'\"]+)?(['\"]\s*\))"), r"\1\2?v=" + rev + r"\3"),
          ]

          for path in root.rglob("*.js"):
              text = path.read_text(encoding="utf-8")
              for pattern, replacement in patterns:
                  text = pattern.sub(replacement, text)
              path.write_text(text, encoding="utf-8")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          text = re.sub(r'(href="\./src/styles/(?:base|home|builder)\.css)(?:\?v=[^"]+)?(")', r'\1?v=' + rev + r'\2', text)
          text = re.sub(r'(src="\./web/main\.js)(?:\?v=[^"]+)?(")', r'\1?v=' + rev + r'\2', text)
          index.write_text(text, encoding="utf-8")

          print(f"Stamped browser bundle revision {rev}")
          PY

      - name: Commit synchronized cache-busted browser bundle
        shell: bash
        run: |
          if git diff --quiet -- web index.html; then
            echo "Browser bundle already matches src and current revision."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web index.html
          git commit -m "Regenerate cache-busted browser bundle"
          git push
