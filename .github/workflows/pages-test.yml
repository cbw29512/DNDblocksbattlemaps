name: Deploy GitHub Pages Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'how-to-play.html'
      - 'src/**'
      - 'web/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages-test.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-test
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install exact dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Smoke test built site in Chromium
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/dnd-blocks-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.mjs
      - name: Verify published help page
        run: |
          test -s dist/how-to-play.html
          grep -q 'How to Play' dist/how-to-play.html
          cmp how-to-play.html public/how-to-play.html
          test -s dist/assets/home-dungeon.svg
          for terrain in castle inn field sea volcano; do test -s "dist/assets/terrain-$terrain.svg"; done
          test -s dist/index.html
          grep -Eq 'assets/[^" ]+\.css' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.css' -size +0c -print -quit)"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
